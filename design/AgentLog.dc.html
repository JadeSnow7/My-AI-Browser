<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #d8dbe2;
    }
    * { box-sizing: border-box; }
    a { color: #7fb3e0; }
    a:hover { color: #a8ccec; }
  </style>
</helmet>

<div style="width: 560px; height: 520px; background: #171a21; border-top: 1px solid #2b2f38; display: flex; flex-direction: column; overflow: hidden;">

  <!-- runtime panel tab strip, lifted from the shipped .panel-tabs -->
  <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 2px; height: 32px; padding: 0 6px; background: #13151b; border-bottom: 1px solid #2b2f38;">
    <button style="border: 0; border-radius: 4px; background: transparent; color: #7e8797; padding: 4px 9px; font-size: 12px; cursor: pointer;">Terminal</button>
    <button style="border: 0; border-radius: 4px; background: transparent; color: #7e8797; padding: 4px 9px; font-size: 12px; cursor: pointer;">Console</button>
    <button style="border: 0; border-radius: 4px; background: transparent; color: #7e8797; padding: 4px 9px; font-size: 12px; cursor: pointer;">Network</button>
    <button style="border: 0; border-radius: 4px; background: #2f3744; color: #ffffff; padding: 4px 9px; font-size: 12px; cursor: pointer;">Agent Log</button>
    <button style="border: 0; border-radius: 4px; background: transparent; color: #7e8797; padding: 4px 9px; font-size: 12px; cursor: pointer;">Runtime</button>
    <span style="flex: 1 1 auto;"></span>
    <button style="width: 22px; height: 22px; border: 0; border-radius: 4px; background: transparent; color: #7e8797; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;" title="暂停">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M9.5 5v14M14.5 5v14"></path></svg>
    </button>
    <button style="width: 22px; height: 22px; border: 0; border-radius: 4px; background: transparent; color: #7e8797; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;" title="停止">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1.5"></rect></svg>
    </button>
    <button style="width: 22px; height: 22px; border: 0; border-radius: 4px; background: transparent; color: #7e8797; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;" title="清空">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5.5h4V7M8 7l.8 11.5h6.4L16 7"></path></svg>
    </button>
  </div>

  <!-- entries: state is carried by SHAPE first and colour second, so the log
       stays readable without colour vision -->
  <div style="flex: 1 1 auto; min-height: 0; position: relative; padding: 10px 14px; overflow: auto; display: flex; flex-direction: column; gap: 2px;">

    <div style="position: absolute; left: 21px; top: 26px; bottom: 26px; width: 1px; background: #2b2f38;"></div>

    <div style="position: relative; display: flex; align-items: flex-start; gap: 10px; padding: 6px 8px 6px 0; border-radius: 5px;">
      <span style="flex: 0 0 auto; width: 16px; height: 18px; display: inline-flex; align-items: center; justify-content: center; background: #171a21;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#98c379" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
      </span>
      <span style="flex: 1 1 auto; font-size: 12px; line-height: 18px; color: #9aa2b1;">打开 Google</span>
      <span style="flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 18px; color: #626c7d;">0.4s</span>
    </div>

    <div style="position: relative; display: flex; align-items: flex-start; gap: 10px; padding: 6px 8px 6px 0; border-radius: 5px;">
      <span style="flex: 0 0 auto; width: 16px; height: 18px; display: inline-flex; align-items: center; justify-content: center; background: #171a21;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#98c379" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
      </span>
      <span style="flex: 1 1 auto; font-size: 12px; line-height: 18px; color: #9aa2b1;">搜索 “Chromium accessibility”</span>
      <span style="flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 18px; color: #626c7d;">1.1s</span>
    </div>

    <!-- a tool call: expandable to the arguments actually sent, so the run is auditable -->
    <div style="position: relative; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 8px 0; border-radius: 5px; background: #1a1d25;">
      <div style="display: flex; align-items: flex-start; gap: 10px;">
        <span style="flex: 0 0 auto; width: 16px; height: 18px; display: inline-flex; align-items: center; justify-content: center; background: #1a1d25;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#98c379" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </span>
        <span style="flex: 1 1 auto; font-size: 12px; line-height: 18px; color: #d8dbe2;">读取文档
          <span style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #7fb3e0;">chromium.googlesource.com</span>
        </span>
        <span style="flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 18px; color: #626c7d;">2.8s</span>
      </div>
      <div style="margin-left: 26px; padding: 8px 10px; background: #0f1218; border: 1px solid #2b2f38; border-radius: 5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 1.6; color: #626c7d;">
        <div><span style="color: #9aa2b1;">tool</span> page.read</div>
        <div><span style="color: #9aa2b1;">selector</span> main article</div>
        <div><span style="color: #9aa2b1;">returned</span> 4,182 tokens</div>
      </div>
    </div>

    <div style="position: relative; display: flex; align-items: flex-start; gap: 10px; padding: 6px 8px 6px 0; border-radius: 5px;">
      <span style="flex: 0 0 auto; width: 16px; height: 18px; display: inline-flex; align-items: center; justify-content: center; background: #171a21;">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: #7fb3e0; display: inline-block;"></span>
      </span>
      <span style="flex: 1 1 auto; font-size: 12px; line-height: 18px; color: #ffffff;">提取要点</span>
      <span style="flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 18px; color: #7fb3e0;">3.2s</span>
    </div>

    <!-- an approval gate is reachable from the log itself, not only from the card -->
    <div style="position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 0; border-radius: 5px; background: #2a2417;">
      <span style="flex: 0 0 auto; width: 16px; height: 18px; display: inline-flex; align-items: center; justify-content: center; background: #2a2417;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e5c07b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 3.5 19h17Z"></path><path d="M12 10v3.6"></path><path d="M12 16.4h.01"></path></svg>
      </span>
      <span style="flex: 1 1 auto; font-size: 12px; line-height: 18px; color: #e5c07b;">等待确认 · 提交订单表单</span>
      <button style="flex: 0 0 auto; height: 22px; padding: 0 10px; border: 1px solid #6b5a2f; border-radius: 5px; background: transparent; color: #e5c07b; font-size: 11px; cursor: pointer;">查看</button>
    </div>

    <!-- failure carries a reason and a way forward, not just a red mark -->
    <div style="position: relative; display: flex; flex-direction: column; gap: 5px; padding: 7px 8px 8px 0; border-radius: 5px; background: #26191c;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="flex: 0 0 auto; width: 16px; height: 18px; display: inline-flex; align-items: center; justify-content: center; background: #26191c;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e08b93" stroke-width="2.2" stroke-linecap="round"><path d="m7 7 10 10M17 7 7 17"></path></svg>
        </span>
        <span style="flex: 1 1 auto; font-size: 12px; line-height: 18px; color: #e08b93;">抓取价格表失败</span>
        <button style="flex: 0 0 auto; height: 22px; padding: 0 10px; border: 1px solid #6b3a41; border-radius: 5px; background: transparent; color: #e08b93; font-size: 11px; cursor: pointer;">重试</button>
      </div>
      <div style="margin-left: 26px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 1.5; color: #a3737a;">表格在 shadow root 内,无障碍树未暴露单元格</div>
    </div>

    <div style="position: relative; display: flex; align-items: flex-start; gap: 10px; padding: 6px 8px 6px 0; border-radius: 5px;">
      <span style="flex: 0 0 auto; width: 16px; height: 18px; display: inline-flex; align-items: center; justify-content: center; background: #171a21;">
        <span style="width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #5c6474; display: inline-block;"></span>
      </span>
      <span style="flex: 1 1 auto; font-size: 12px; line-height: 18px; color: #7e8797;">对比结果</span>
      <span style="flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 18px; color: #5c6474;">待执行</span>
    </div>
  </div>

  <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 14px; background: #13151b; border-top: 1px solid #2b2f38; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #626c7d;">
    <span style="color: #e5c07b;">已暂停,等待确认</span>
    <span>·</span>
    <span>4/7</span>
    <span style="flex: 1 1 auto;"></span>
    <span>Build Browser Agent</span>
  </div>
</div>
</x-dc>
</body>
</html>
