<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #d8dbe2;
    }
    * { box-sizing: border-box; }
    a { color: #7fb3e0; }
    a:hover { color: #a8ccec; }
  </style>
</helmet>

<div style="width: 440px; height: 620px; background: #0f1218; position: relative; overflow: hidden;">

  <!-- same page, same recession -->
  <div style="position: absolute; inset: 0; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; opacity: 0.42;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 18px; height: 18px; border-radius: 4px; background: #2f3744;"></div>
      <div style="width: 96px; height: 9px; border-radius: 3px; background: #2b313c;"></div>
      <div style="flex: 1 1 auto;"></div>
      <div style="width: 44px; height: 9px; border-radius: 3px; background: #232833;"></div>
    </div>
    <div style="width: 210px; height: 15px; border-radius: 4px; background: #333a47; margin-top: 6px;"></div>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px;">
      <div style="height: 34px; border: 1px solid #2b2f38; border-radius: 6px; background: #14181f;"></div>
      <div style="height: 34px; border: 1px solid #2b2f38; border-radius: 6px; background: #14181f;"></div>
      <div style="display: flex; gap: 10px;">
        <div style="flex: 1 1 0; height: 34px; border: 1px solid #2b2f38; border-radius: 6px; background: #14181f;"></div>
        <div style="flex: 1 1 0; height: 34px; border: 1px solid #2b2f38; border-radius: 6px; background: #14181f;"></div>
      </div>
    </div>
  </div>

  <!-- scrim: the pane stops accepting input, which is the whole cost of this variant -->
  <div style="position: absolute; inset: 0; background: rgba(9, 11, 15, 0.74); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 12px;">

    <div style="width: 100%; padding: 14px; background: #1a1d25; border: 1px solid #414958; border-radius: 8px; box-shadow: 0 18px 60px #000b; display: flex; flex-direction: column; gap: 11px;">

      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e08b93" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 4.5 6.2v5.4c0 4.4 3.1 8.5 7.5 9.4 4.4-.9 7.5-5 7.5-9.4V6.2Z"></path>
          <path d="M12 9v4"></path>
          <path d="M12 16.2h.01"></path>
        </svg>
        <span style="font-size: 13px; font-weight: 600; color: #d8dbe2;">需要你确认</span>
        <span style="flex: 1 1 auto;"></span>
        <span style="padding: 3px 8px; border-radius: 999px; background: #3d2429; color: #e08b93; font-size: 11px; line-height: 1;">高风险 · 不可撤销</span>
      </div>

      <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #ffffff;">
        提交订单表单到
        <span style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: #e5c07b;">checkout.example.com</span>
      </p>

      <div style="padding: 10px 12px; background: #0f1218; border: 1px solid #2b2f38; border-radius: 6px; display: flex; flex-direction: column; gap: 7px;">
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="width: 96px; flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #626c7d;">card_number</span>
          <span style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #9aa2b1;">•••• •••• •••• 4242</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="width: 96px; flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #626c7d;">amount</span>
          <span style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #e5c07b;">¥1,284.00</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="width: 96px; flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #626c7d;">email</span>
          <span style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #9aa2b1;">k****a@gmail.com</span>
        </div>
        <button style="align-self: flex-start; margin-top: 1px; padding: 0; border: 0; background: transparent; color: #7fb3e0; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; cursor: pointer;">展开其余 2 项</button>
      </div>

      <div style="display: flex; align-items: center; gap: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #626c7d;">
        <span style="color: #7fb3e0;">Build Browser Agent</span>
        <span>·</span>
        <span>步骤 4/7</span>
        <span>·</span>
        <span>Fill checkout form</span>
      </div>

      <div style="display: flex; gap: 8px;">
        <button style="flex: 0 0 auto; height: 30px; padding: 0 16px; border: 1px solid #555e6d; border-radius: 6px; background: transparent; color: #c8ccd4; font-size: 13px; cursor: pointer;">拒绝</button>
        <button style="flex: 1 1 auto; height: 30px; border: 0; border-radius: 6px; background: #4c8ed9; color: #0d0f13; font-size: 13px; font-weight: 600; cursor: pointer;">批准一次</button>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <button style="flex: 1 1 auto; padding: 0; border: 0; background: transparent; color: #7e8797; font-size: 11px; text-align: left; cursor: pointer;">本任务内始终允许此站点的表单提交</button>
        <span style="flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #626c7d;">esc 拒绝 · ⏎ 批准</span>
      </div>
    </div>

    <p style="margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #626c7d; text-align: center;">此期间该窗格不接受任何页面操作</p>
  </div>
</div>
</x-dc>
</body>
</html>
